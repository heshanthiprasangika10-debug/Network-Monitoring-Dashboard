<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetMon Login</title>
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2639;--line:#2a3550;--text:#e6ebf5;--muted:#8c98b3;--down:#ef4444;--accent:#6366f1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  .box{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px}
  h1{margin:0 0 4px;font-size:22px}
  p{margin:0 0 22px;color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:8px;font-size:15px}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{width:100%;margin-top:22px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
  .err{margin-top:14px;color:var(--down);font-size:13px;min-height:16px}
</style>
</head>
<body>
  <form class="box" method="post" autocomplete="on">
    <h1>🌐 NetMon</h1>
    <p>login to your NetMon Dashboard</p>
    <label for="u">Username</label>
    <input id="u" name="username" required autofocus autocomplete="username">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" required autocomplete="current-password">
    <button type="submit">Login</button>
    <div class="err">{{ error }}</div>
  </form>
</body>
</html>
